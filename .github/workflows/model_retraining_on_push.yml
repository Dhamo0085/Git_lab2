name: Model Retraining on Push
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and store timestamp
        run: date +%Y%m%d%H%M%S > timestamp.txt
      - name: Train model
        run: python -m src.train_model
      - name: Evaluate model
        run: python -m src.evaluate_model
      - name: Commit and push model and metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models metrics timestamp.txt
          git commit -m "Add model and metrics $(cat timestamp.txt)" || echo "Nothing to commit"
          git pull --rebase origin main
          git push
